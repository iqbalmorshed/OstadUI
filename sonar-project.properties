sonar.projectKey=ostad-app
sonar.projectName=ostad-app
sonar.projectVersion=0.0.0

# Source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.jsx,**/*.test.js,**/*.spec.jsx,**/*.spec.js,src/assets/**

# Test directories
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.spec.jsx,**/*.spec.js

# Coverage reports (lcov format generated by Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js
sonar.sourceEncoding=UTF-8
